version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the code for live-reloading during development
      - .:/app
    environment:
      # Set PYTHONPATH to ensure all modules are discoverable inside the container
      PYTHONPATH: /app
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload
