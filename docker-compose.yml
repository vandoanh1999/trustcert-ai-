version: '3.9'

volumes:
  neo4j_data:
  minio_data:

services:
  minio:
    # ... (giữ nguyên)

  frontend:
    # ... (giữ nguyên)

  proactive-core:
    build: ./services/proactive
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8008
    ports: ["8008:8008"]
    depends_on: [redis, router, gnn]

  redis:
    # ... (giữ nguyên)

  gateway:
    build: .
    command: uvicorn api.gateway:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [minio, redis, graph, router, gnn]

  worker:
    build: .
    env_file: .env
    command: celery -A tasks worker --loglevel=info -Q assimilate
    depends_on: [minio, graph, router, gnn, redis]

  graph:
    build: ./services/graph
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]

  router:
    build: ./services/router
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8005
    ports: ["8005:8005"]

  gnn:
    build: ./services/gnn
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8006
    ports: ["8006:8006"]
