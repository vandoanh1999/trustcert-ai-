version: '3.9'
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: --model meta-llama/Meta-Llama-3-8B-Instruct --port 8001 --enable-lora --max-lora-rank 8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8001:8001"
    volumes:
      - ./lora_storage:/app/lora_storage

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on: [gateway]

  proactive-core:
    build: ./services/proactive
    command: uvicorn main:app --host 0.0.0.0 --port 8008
    ports:
      - "8008:8008"
    depends_on: [redis, router, gnn, embedder]

  qdrant:
    image: qdrant/qdrant:v1.10
    ports:
      - "6333:6333"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5.12
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  gateway:
    build: .
    command: uvicorn api.gateway:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on: [vllm, qdrant, redis, batcher, embedder, graph, router, gnn, neo4j, trainer]

  worker:
    build: .
    command: celery -A tasks worker --loglevel=info -Q assimilate
    deploy:
      replicas: 4
    depends_on: [batcher, embedder, graph, router, gnn, qdrant, redis, neo4j, trainer]
    volumes:
      - ./lora_storage:/app/lora_storage

  batcher:
    build: ./services/batcher
    command: uvicorn main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"

  embedder:
    build: ./services/embedder
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8002:8002"

  graph:
    build: ./services/graph
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"

  router:
    build: ./services/router
    command: uvicorn main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"

  gnn:
    build: ./services/gnn
    command: uvicorn main:app --host 0.0.0.0 --port 8006
    ports:
      - "8006:8006"

  trainer:
    build: ./services/trainer
    command: uvicorn main:app --host 0.0.0.0 --port 8007
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8007:8007"
    volumes:
      - ./lora_storage:/app/lora_storage
