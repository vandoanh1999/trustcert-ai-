services:
  # --- Dịch vụ Nền ---
  - type: worker # Đã chuyển sang worker để tương thích Free Tier
    name: redis
    runtime: docker
    dockerfilePath: ./dockerfiles/redis.Dockerfile
    autoDeploy: false

  # --- Dịch vụ Gateway Công Khai ---
  - type: web
    name: gateway
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.gateway:app --timeout 120"
    healthCheckPath: /health
    envVars:
      - fromGroup: twp-omega-secrets

  # --- Các Worker AI/API (Nội bộ) ---
  - type: worker # Chuyển sang worker để bảo mật
    name: graph-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.graph.main:app --timeout 120"
    envVars:
      - fromGroup: twp-omega-secrets

  - type: worker # Chuyển sang worker để bảo mật
    name: router-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.router.main:app --timeout 120"
    envVars:
      - fromGroup: twp-omega-secrets

  - type: worker # Chuyển sang worker để bảo mật
    name: gnn-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.gnn.main:app --timeout 120"
    envVars:
      - fromGroup: twp-omega-secrets

  # --- Các Worker Chạy Nền Khác ---
  - type: worker
    name: celery-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A tasks worker --loglevel=info -Q assimilate,default"
    envVars:
      - fromGroup: twp-omega-secrets

  - type: worker
    name: proactive-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m services.proactive.main"
    envVars:
      - fromGroup: twp-omega-secrets

  # --- Giao diện Frontend ---
  - type: web
    name: frontend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0"
    autoDeploy: true
    envVars:
      - fromGroup: twp-omega-secrets
