# render.yaml - Cấu hình triển khai trên Render.com
# Đã được cập nhật để sử dụng biến môi trường riêng lẻ, giúp đơn giản hóa việc thiết lập.
services:
  # --- Dịch vụ Nền ---
  - type: worker
    name: redis
    runtime: docker
    dockerfilePath: ./dockerfiles/redis.Dockerfile
    autoDeploy: false

  # --- Dịch vụ Gateway Công Khai ---
  - type: web
    name: gateway
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.gateway:app --timeout 120"
    healthCheckPath: /health
    envVars:
      # Secrets (Render sẽ hỏi bạn nhập giá trị)
      - key: NEO4J_URI
      - key: NEO4J_USER
      - key: NEO4J_PASSWORD
      - key: QDRANT_URL
      - key: QDRANT_API_KEY
      - key: HF_TOKEN
      - key: API_KEY
      # Non-secrets (Có giá trị mặc định)
      - key: LOG_LEVEL
        value: INFO
      - key: BASE_MODEL_NAME
        value: meta-llama/Meta-Llama-3-8B-Instruct
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_MODEL_DIM
        value: 384
      # Service Discovery (Render tự động inject)
      - key: REDIS_URL
        fromService:
          type: worker
          name: redis
          property: url

  # --- Các Worker AI/API (Nội bộ) ---
  - type: worker
    name: graph-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.graph.main:app --timeout 120"
    envVars:
      - key: NEO4J_URI
      - key: NEO4J_USER
      - key: NEO4J_PASSWORD
      - key: QDRANT_URL
      - key: QDRANT_API_KEY
      - key: HF_TOKEN
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: REDIS_URL
        fromService:
          type: worker
          name: redis
          property: url

  - type: worker
    name: router-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.router.main:app --timeout 120"
    envVars:
      - key: QDRANT_URL
      - key: QDRANT_API_KEY
      - key: HF_TOKEN
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5

  - type: worker
    name: gnn-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.gnn.main:app --timeout 120"
    envVars:
      - key: NEO4J_URI
      - key: NEO4J_USER
      - key: NEO4J_PASSWORD
      - key: HF_TOKEN
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5

  # --- Các Worker Chạy Nền Khác ---
  - type: worker
    name: celery-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A tasks worker --loglevel=info -Q assimilate,default"
    envVars:
      - key: NEO4J_URI
      - key: NEO4J_USER
      - key: NEO4J_PASSWORD
      - key: QDRANT_URL
      - key: QDRANT_API_KEY
      - key: HF_TOKEN
      - key: BASE_MODEL_NAME
        value: meta-llama/Meta-Llama-3-8B-Instruct
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: REDIS_URL
        fromService:
          type: worker
          name: redis
          property: url
      - key: API_GATEWAY_INTERNAL_URL
        value: http://gateway:8000

  - type: worker
    name: proactive-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m services.proactive.main"
    envVars:
      - key: API_KEY
      - key: API_GATEWAY_INTERNAL_URL
        value: http://gateway:8000

  # --- Giao diện Frontend ---
  - type: web
    name: frontend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0"
    autoDeploy: true
    envVars:
      # Service Discovery (Render provides the public URL of the gateway)
      - key: API_GATEWAY_URL
        fromService:
          type: web
          name: gateway
          property: url
