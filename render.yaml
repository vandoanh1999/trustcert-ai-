services:
  # --- Background Services ---
  - type: private
    name: redis
    runtime: docker
    dockerfilePath: ./dockerfiles/redis.Dockerfile
    autoDeploy: false

  # --- AI/API Services (CPU) ---
  - type: web
    name: gateway
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.gateway:app --timeout 120"
    healthCheckPath: /health
    envVars:
      - fromGroup: twp-omega-secrets

  - type: web
    name: graph-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.graph.main:app --timeout 120"
    healthCheckPath: /health
    envVars:
      - fromGroup: twp-omega-secrets

  - type: web
    name: router-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.router.main:app --timeout 120"
    healthCheckPath: /health
    envVars:
      - fromGroup: twp-omega-secrets

  - type: web
    name: gnn-service
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker services.gnn.main:app --timeout 120"
    healthCheckPath: /health
    envVars:
      - fromGroup: twp-omega-secrets

  # --- Background Workers ---
  - type: worker
    name: celery-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A tasks worker --loglevel=info -Q assimilate,default"
    envVars:
      - fromGroup: twp-omega-secrets

  - type: worker
    name: proactive-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m services.proactive.main"
    envVars:
      - fromGroup: twp-omega-secrets

  # --- Frontend ---
  - type: static
    name: frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/build"
    autoDeploy: true
